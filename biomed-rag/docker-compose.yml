# docker compose up --build                      (API + UI; LLM via .env, e.g. Groq)
# docker compose --profile ollama up --build     (also runs Ollama in a container)
services:
  api:
    build: .
    env_file: .env
    environment:
      OLLAMA_URL: ${OLLAMA_URL_DOCKER:-http://ollama:11434}
    volumes:
      - ./data:/app/data          # corpus, indexes and HF model cache live on the host
    ports: ["8000:8000"]

  ui:
    build: .
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]

  ollama:
    image: ollama/ollama
    profiles: ["ollama"]
    volumes: ["ollama:/root/.ollama"]
    ports: ["11434:11434"]

volumes:
  ollama:
